name: Test Influencer Opportunities
on:
  pull_request:
    paths:
      - '*influencer*'
      - 'creator-upload.js'
      - 'apps-script-creator-upload.js'
      - 'tests/**'
      - '.github/workflows/*influencer*'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install requests
      - run: python -m unittest discover -s tests -v
      - run: |
          node --check influencer-opportunities.js
          node --check creator-upload.js
          node --check apps-script-creator-upload.js
