name: Update Influencer Opportunities
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Total ASIN cohort across resumes (start with 100; max 10000)
        default: '100'
        required: true
      batch_size:
        description: ASINs per request (1â€“100)
        default: '10'
        required: true
      token_budget:
        description: Maximum reserved tokens for this run including retries
        default: '100'
        required: true
      refresh_asins:
        description: Optional FINAL paid video refresh — paste previously scanned ASINs, comma separated. Leave blank for cheap scan.
        default: ""
        required: false
      reset:
        description: Explicitly discard prior cohort/cache and start again (can spend tokens again)
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: influencer-opportunities
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate refresh selection
        env:
          REFRESH_ASINS: ${{ inputs.refresh_asins }}
          RESET: ${{ inputs.reset }}
        run: |
          if [ -n "$REFRESH_ASINS" ] && [ "$RESET" = "true" ]; then
            echo "A final refresh requires the existing checkpoint. Keep reset off."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Restore durable checkpoint
        id: restore
        if: ${{ !inputs.reset }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python influencer_checkpoint.py
      - name: Scan bounded cohort
        id: scan
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          SCAN_LIMIT: ${{ inputs.limit }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          REFRESH_ASINS: ${{ inputs.refresh_asins }}
          TOKEN_BUDGET: ${{ inputs.token_budget }}
        run: python influencer_pipeline.py --limit "$SCAN_LIMIT" --batch-size "$BATCH_SIZE" --token-budget "$TOKEN_BUDGET" --seconds 900 --refresh-asins "$REFRESH_ASINS"
      - name: Persist checkpoint even after scanner failure
        if: ${{ always() && steps.scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: influencer-checkpoint
          path: .influencer-state/checkpoint.sqlite
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Publish results and status
        if: ${{ always() && steps.scan.outcome != 'skipped' }}
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/influencer/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update influencer opportunity results'
          for attempt in 1 2 3; do
            git pull --rebase origin "$TARGET_BRANCH"
            if git push origin "HEAD:$TARGET_BRANCH"; then exit 0; fi
            sleep 5
          done
          exit 1
